<div class="crud_app">
    <h2 class="title">User CRUD</h2>
    <div class="crud_app_form_container">
        <form (ngSubmit)="saveUser()">
            <div class="input_group">
                <input type="text" [(ngModel)]="user.name" name="name" required />
                <label class="placeholder">Name</label>
            </div>
            <div class="input_group">
                <input type="email" [(ngModel)]="user.email" name="email" required />
                <label class="placeholder">Email</label>
            </div>
            <div class="input_group">
                <input type="text" [(ngModel)]="user.phone" name="phone" required />
                <label class="placeholder">Phone</label>
            </div>
            <div class="input_group">
                <input type="text" [(ngModel)]="user.gender" name="gender" required />
                <label class="placeholder">Gender</label>
            </div>
            <button class="submit_button" type="submit">{{ isEdit ? 'Update' : 'Add' }}</button>
        </form>
    </div>
    <hr width="75%">
    <div class="user_table">
        <h2>User LIST</h2>
    </div>
    <div class="user_list">
        <table class="list_table">
            <colgroup>
                <col style="width: 20%; text-overflow: ellipsis;">
                <col style="width: 25%; text-overflow: ellipsis;">
                <col style="width: 15%; text-overflow: ellipsis;">
                <col style="width: 15%; text-overflow: ellipsis;">
                <col style="width: 10%;">
            </colgroup>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Gender</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody *ngFor="let u of users">
                <tr>
                    <td>{{u.name}}</td>
                    <td>{{u.email}}</td>
                    <td>{{u.phone}}</td>
                    <td>{{u.gender}}</td>
                    <td>
                        <button class="edit_button" (click)="editUser(u)">Edit</button>
                        <button class="delete_button" *ngIf="u.id !== undefined" (click)="deleteUser(u.id)">X</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
